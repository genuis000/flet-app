name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install 'flet[all]'
      - run: flet build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: APK安装包
          path: build/android/*.apk
